<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Switching Demo</title>
<style>
  :root{
    --bg:#fafafa;
    --text:#111111;
    --dim:#8a8a8a;
    --line:#dddddd;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101010;
      --text:#ededed;
      --dim:#777777;
      --line:#2c2c2c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101010;
    --text:#ededed;
    --dim:#777777;
    --line:#2c2c2c;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
  }
  *{ box-sizing:border-box; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #app{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    width:100%;
  }
  #stage{
    position:relative;
    width:min(340px, 80vw);
    height:min(340px, 80vw);
  }
  .slot{
    position:absolute;
    font-family:"SF Mono","Menlo","Consolas",monospace;
    font-size:clamp(28px, 6vw, 42px);
    font-weight:600;
    color:var(--text);
    transform:translate(-50%,-50%);
    user-select:none;
    letter-spacing:1px;
  }
  .pos-tl{ top:26%; left:28%; }
  .pos-tr{ top:26%; left:72%; }
  .pos-bl{ top:74%; left:28%; }
  .pos-br{ top:74%; left:72%; }

  #startScreen{
    color:var(--text);
    font-size:14px;
    text-align:left;
    max-width:360px;
    width:90vw;
    line-height:1.6;
  }
  #startScreen .rule-line{ margin:4px 0; }

  .setting-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
  }
  .setting-label{
    color:var(--dim);
    min-width:82px;
  }
  .mode-btn{
    font-family:inherit;
    font-size:13px;
    padding:6px 12px;
    border-radius:4px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  #isi-select{
    font-family:inherit;
    font-size:13px;
    padding:5px 8px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--text);
  }
  .begin-btn{
    display:block;
    margin:24px auto 0 auto;
    font-family:inherit;
    font-size:14px;
    padding:8px 22px;
    border-radius:4px;
    border:1px solid var(--text);
    background:var(--text);
    color:var(--bg);
    cursor:pointer;
  }

  #statsScreen{
    text-align:left;
    font-size:14px;
    max-width:420px;
    width:90vw;
    padding:0 12px;
  }
  #statsScreen .stat-line{ margin:6px 0; }
  table{ border-collapse:collapse; margin:14px 0; width:100%; }
  td, th{
    padding:4px 8px;
    text-align:right;
    font-variant-numeric: tabular-nums;
    border-bottom:1px solid var(--line);
  }
  th{ color:var(--dim); font-weight:500; }
  td:first-child, th:first-child{ text-align:left; }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="startScreen">
    <div class="rule-line">Top positions: consonant &rarr; D&nbsp;&nbsp;&nbsp;vowel &rarr; K</div>
    <div class="rule-line">Bottom positions: even &rarr; D&nbsp;&nbsp;&nbsp;odd &rarr; K</div>

    <div class="setting-row">
      <span class="setting-label">Condition</span>
      <button class="mode-btn active" data-mode="crosstalk" id="mode-crosstalk">Crosstalk</button>
      <button class="mode-btn" data-mode="neutral" id="mode-neutral">Neutral</button>
    </div>

    <div class="setting-row">
      <span class="setting-label">RS interval</span>
      <select id="isi-select">
        <option value="150">150 ms</option>
        <option value="300">300 ms</option>
        <option value="450">450 ms</option>
        <option value="500" selected>500 ms</option>
        <option value="600">600 ms</option>
        <option value="900">900 ms</option>
        <option value="1200">1200 ms</option>
      </select>
    </div>

    <button class="begin-btn" id="beginBtn">Begin</button>
  </div>

  <div id="stage" class="hidden">
    <div class="slot pos-tl" id="slot-tl"></div>
    <div class="slot pos-tr" id="slot-tr"></div>
    <div class="slot pos-bl" id="slot-bl"></div>
    <div class="slot pos-br" id="slot-br"></div>
  </div>

  <div id="statsScreen" class="hidden"></div>
</div>

<script>
(function(){
  const CONSONANTS = ['G','K','M','R'];
  const VOWELS = ['A','E','I','U'];
  const EVENS = ['2','4','6','8'];
  const ODDS = ['3','5','7','9'];
  const NEUTRALS = ['#','?','*','%'];

  const LOCATION_INFO = {
    tl: { task:'letter' },
    tr: { task:'letter' },
    br: { task:'number' },
    bl: { task:'number' }
  };
  // Fixed clockwise rotation: TL -> TR -> BR -> BL -> TL ...
  // (top pair = letter task, bottom pair = number task, so this
  // naturally yields the AABB task sequence.)
  const ROTATION = ['tl', 'tr', 'br', 'bl'];

  const TOTAL_TRIALS = 40;
  let ISI = 500; // ms blank between response and next stimulus; set at Begin
  let mode = 'crosstalk'; // 'crosstalk' or 'neutral'

  let trialIndex = 0;
  let prevLetter = null;
  let prevDigit = null;
  let prevNeutral = null;
  let prevTask = null;
  let data = [];
  let currentTrial = null;
  let onsetTime = 0;
  let awaitingResponse = false;

  const slots = {
    tl: document.getElementById('slot-tl'),
    tr: document.getElementById('slot-tr'),
    bl: document.getElementById('slot-bl'),
    br: document.getElementById('slot-br')
  };
  const stage = document.getElementById('stage');
  const startScreen = document.getElementById('startScreen');
  const statsScreen = document.getElementById('statsScreen');
  const isiSelect = document.getElementById('isi-select');
  const beginBtn = document.getElementById('beginBtn');
  const modeBtns = document.querySelectorAll('.mode-btn');

  modeBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      mode = btn.dataset.mode;
      modeBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

  beginBtn.addEventListener('click', startExperiment);

  function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function pickLetter(prev){
    const pool = CONSONANTS.concat(VOWELS).filter(c => c !== prev);
    return randFrom(pool);
  }
  function pickDigit(prev){
    const pool = EVENS.concat(ODDS).filter(c => c !== prev);
    return randFrom(pool);
  }
  function pickNeutral(prev){
    const pool = NEUTRALS.filter(c => c !== prev);
    return randFrom(pool);
  }
  function clearSlots(){
    Object.values(slots).forEach(s => s.textContent = '');
  }

  function startExperiment(){
    const parsed = parseInt(isiSelect.value, 10);
    ISI = isNaN(parsed) ? 500 : parsed;
    startScreen.classList.add('hidden');
    stage.classList.remove('hidden');
    document.addEventListener('keydown', handleKey);
    nextTrial();
  }

  function nextTrial(){
    if(trialIndex >= TOTAL_TRIALS){
      endExperiment();
      return;
    }
    clearSlots();

    const locId = ROTATION[trialIndex % ROTATION.length];
    const task = LOCATION_INFO[locId].task;
    const letterFirst = Math.random() < 0.5;

    let letter = null, digit = null, text, correctKey;

    if(mode === 'crosstalk'){
      letter = pickLetter(prevLetter);
      digit = pickDigit(prevDigit);
      text = letterFirst ? (letter + digit) : (digit + letter);
      correctKey = task === 'letter'
        ? (CONSONANTS.includes(letter) ? 'D' : 'K')
        : (EVENS.includes(digit) ? 'D' : 'K');
      prevLetter = letter;
      prevDigit = digit;
    } else { // neutral
      const neutral = pickNeutral(prevNeutral);
      prevNeutral = neutral;
      if(task === 'letter'){
        letter = pickLetter(prevLetter);
        prevLetter = letter;
        text = letterFirst ? (letter + neutral) : (neutral + letter);
        correctKey = CONSONANTS.includes(letter) ? 'D' : 'K';
      } else {
        digit = pickDigit(prevDigit);
        prevDigit = digit;
        text = letterFirst ? (digit + neutral) : (neutral + digit);
        correctKey = EVENS.includes(digit) ? 'D' : 'K';
      }
    }

    currentTrial = {
      index: trialIndex,
      location: locId,
      task: task,
      mode: mode,
      letter: letter,
      digit: digit,
      order: letterFirst ? 'first' : 'second',
      correctKey: correctKey,
      switchType: prevTask === null ? null : (task === prevTask ? 'repeat' : 'switch')
    };

    prevTask = task;

    setTimeout(function(){
      slots[locId].textContent = text;
      onsetTime = performance.now();
      awaitingResponse = true;
    }, ISI);
  }

  function handleKey(e){
    if(!awaitingResponse) return;
    const k = e.key.toUpperCase();
    if(k !== 'D' && k !== 'K') return;

    const rt = performance.now() - onsetTime;
    awaitingResponse = false;

    currentTrial.response = k;
    currentTrial.rt = rt;
    currentTrial.correct = (k === currentTrial.correctKey);
    data.push(currentTrial);

    clearSlots();
    trialIndex++;
    nextTrial();
  }

  function mean(arr){ return arr.reduce((a,b) => a+b, 0) / arr.length; }

  function endExperiment(){
    document.removeEventListener('keydown', handleKey);
    stage.classList.add('hidden');

    const correctTrials = data.filter(d => d.correct);
    const overallAcc = (correctTrials.length / data.length * 100).toFixed(1);
    const overallRT = correctTrials.length ? mean(correctTrials.map(d => d.rt)).toFixed(0) : '--';

    const locStats = ROTATION.map(function(locId){
      const trials = data.filter(d => d.location === locId);
      const correct = trials.filter(d => d.correct);
      const acc = trials.length ? (correct.length / trials.length * 100).toFixed(1) : '--';
      const rt = correct.length ? mean(correct.map(d => d.rt)).toFixed(0) : '--';
      return { loc: locId, task: LOCATION_INFO[locId].task, n: trials.length, acc: acc, rt: rt };
    });

    const repeatTrials = data.filter(d => d.switchType === 'repeat' && d.correct);
    const switchTrials = data.filter(d => d.switchType === 'switch' && d.correct);
    const repeatRT = repeatTrials.length ? mean(repeatTrials.map(d => d.rt)) : null;
    const switchRT = switchTrials.length ? mean(switchTrials.map(d => d.rt)) : null;
    const switchCost = (repeatRT !== null && switchRT !== null) ? (switchRT - repeatRT) : null;

    let html = '';
    html += '<div class="stat-line">Condition: ' + (data[0] ? data[0].mode : mode) + ' &middot; RS interval: ' + ISI + ' ms</div>';
    html += '<div class="stat-line">Overall accuracy: ' + overallAcc + '%</div>';
    html += '<div class="stat-line">Overall mean RT (correct trials): ' + overallRT + ' ms</div>';

    html += '<table><thead><tr><th>Location</th><th>Task</th><th>N</th><th>Acc %</th><th>RT ms</th></tr></thead><tbody>';
    locStats.forEach(function(s){
      html += '<tr><td>' + s.loc.toUpperCase() + '</td><td>' + s.task + '</td><td>' + s.n + '</td><td>' + s.acc + '</td><td>' + s.rt + '</td></tr>';
    });
    html += '</tbody></table>';

    html += '<div class="stat-line">Repeat-trial RT: ' + (repeatRT !== null ? repeatRT.toFixed(0) + ' ms (n=' + repeatTrials.length + ')' : '--') + '</div>';
    html += '<div class="stat-line">Switch-trial RT: ' + (switchRT !== null ? switchRT.toFixed(0) + ' ms (n=' + switchTrials.length + ')' : '--') + '</div>';
    html += '<div class="stat-line">Task-switch cost: ' + (switchCost !== null ? switchCost.toFixed(0) + ' ms' : '--') + '</div>';

    statsScreen.innerHTML = html;
    statsScreen.classList.remove('hidden');
  }

})();
</script>
</body>
</html>
