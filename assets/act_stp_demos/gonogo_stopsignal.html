<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Response Inhibition Tasks</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    user-select: none;
  }

  #menuScreen {
    display: flex;
    gap: 30px;
  }

  .menuBtn {
    font-size: 22px;
    padding: 20px 40px;
    border-radius: 10px;
    border: none;
    background: #34495e;
    color: white;
    cursor: pointer;
  }
  .menuBtn:hover {
    background: #2c3e50;
  }

  #stopSignalScreen, #resultsScreen {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  #stimulusArea {
    position: relative;
    width: 300px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #arrowStim {
    font-size: 100px;
    line-height: 1;
    font-weight: bold;
    color: #2c3e50;
  }

  #circleStim {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #e74c3c;
    opacity: 0;
    pointer-events: none;
  }
  #circleStim.visible {
    opacity: 1;
  }

  #resultsScreen {
    text-align: center;
    font-size: 20px;
    color: #333;
  }

  #resultsScreen div {
    margin: 10px 0;
  }

  #restartBtn {
    margin-top: 20px;
    padding: 10px 24px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #aaa;
    background: white;
    cursor: pointer;
  }
  #gngScreen {
  display: none;
  align-items: center;
  justify-content: center;
  height: 260px;
}

  #gngWord {
    font-size: 60px;
    font-weight: bold;
    color: #000;
  }

  #gngResultsScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-size: 20px;
    color: #333;
  }

  #gngResultsScreen div {
    margin: 10px 0;
  }
</style>
</head>
<body>

<div id="menuScreen">
  <button class="menuBtn" id="goNoGoBtn">Go/No-Go</button>
  <button class="menuBtn" id="stopSignalBtn">Stop Signal</button>
</div>

<div id="stopSignalScreen">
  <div id="stimulusArea">
    <div id="circleStim"></div>
    <div id="arrowStim"></div>
  </div>
</div>

<div id="resultsScreen">
  <div id="avgRT"></div>
  <div id="finalSSD"></div>
  <button id="restartBtn">Restart</button>
</div>

<div id="gngScreen">
  <div id="gngWord"></div>
</div>

<div id="gngResultsScreen">
  <div id="gngAvgRT"></div>
  <div id="gngErrors"></div>
  <button id="gngRestartBtn">Restart</button>
</div>

<script>
const menuScreen = document.getElementById('menuScreen');
const goNoGoBtn = document.getElementById('goNoGoBtn');
const stopSignalBtn = document.getElementById('stopSignalBtn');
const stopSignalScreen = document.getElementById('stopSignalScreen');
const resultsScreen = document.getElementById('resultsScreen');
const arrowStim = document.getElementById('arrowStim');
const circleStim = document.getElementById('circleStim');
const avgRTEl = document.getElementById('avgRT');
const finalSSDEl = document.getElementById('finalSSD');
const restartBtn = document.getElementById('restartBtn');

const gngScreen = document.getElementById('gngScreen');
const gngWord = document.getElementById('gngWord');
const gngResultsScreen = document.getElementById('gngResultsScreen');
const gngAvgRT = document.getElementById('gngAvgRT');
const gngErrorsEl = document.getElementById('gngErrors');
const gngRestartBtn = document.getElementById('gngRestartBtn');

const TOTAL_GNG_TRIALS = 50;
const GNG_RESPONSE_WINDOW = 1000;

goNoGoBtn.addEventListener('click', startGoNoGoTask);

const RESPONSE_WINDOW = 1000; // ms max time to respond
const ITI = 1000;             // ms between trials

let currentSSD = 5;
let failStreakAtSSD = 0;
let goRTs = [];

let trialActive = false;
let responded = false;
let trialStart = 0;
let currentDirection = null;
let currentIsStop = false;

let circleTimer = null;
let endTimer = null;

let gngTrialIndex = 0;
let gngErrors = 0;
let gngRTs = [];
let gngTrialActive = false;
let gngResponded = false;
let gngTrialStart = 0;
let gngIsGo = true;
let gngTimer = null;

function startStopSignalTask() {
  menuScreen.style.display = 'none';
  resultsScreen.style.display = 'none';
  stopSignalScreen.style.display = 'flex';

  currentSSD = 5;
  failStreakAtSSD = 0;
  goRTs = [];

  runTrial();
}

function runTrial() {
  currentIsStop = Math.random() < 0.25;
  currentDirection = Math.random() < 0.5 ? 'left' : 'right';

  arrowStim.textContent = currentDirection === 'left' ? '←' : '→';
  circleStim.classList.remove('visible');

  responded = false;
  trialActive = true;
  trialStart = performance.now();

  if (currentIsStop) {
    circleTimer = setTimeout(() => {
      circleStim.classList.add('visible');
    }, currentSSD);
  }

  endTimer = setTimeout(() => {
    finishTrial('timeout');
  }, RESPONSE_WINDOW);
}

function finishTrial(type, pressedDir, rt) {
  if (!trialActive) return;
  trialActive = false;

  clearTimeout(circleTimer);
  clearTimeout(endTimer);
  circleStim.classList.remove('visible');
  arrowStim.textContent = ''; // clear arrow during ITI

  if (currentIsStop) {
    if (type === 'response') {
      failStreakAtSSD++;
      if (failStreakAtSSD >= 3) {
        endTask();
        return;
      }
    } else {
      currentSSD += 20;
      failStreakAtSSD = 0;
    }
  } else {
    if (type === 'response' && pressedDir === currentDirection) {
      goRTs.push(rt);
    }
  }

  setTimeout(runTrial, ITI);
}

document.addEventListener('keydown', (e) => {
  if (!trialActive || responded) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;

  responded = true;
  const rt = performance.now() - trialStart;
  const pressedDir = e.key === 'ArrowLeft' ? 'left' : 'right';
  finishTrial('response', pressedDir, rt);
});

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (!gngTrialActive || gngResponded) return;

  gngResponded = true;
  const rt = performance.now() - gngTrialStart;
  finishGoNoGoTrial('response', rt);
});

function endTask() {
  stopSignalScreen.style.display = 'none';

  const avg = goRTs.length
    ? Math.round(goRTs.reduce((a, b) => a + b, 0) / goRTs.length)
    : 0;

  avgRTEl.textContent = `Average Go RT: ${avg} ms (n=${goRTs.length})`;
  finalSSDEl.textContent = `Final SSD reached: ${currentSSD} ms`;

  resultsScreen.style.display = 'flex';
}

restartBtn.addEventListener('click', () => {
  resultsScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
});

function startGoNoGoTask() {
  menuScreen.style.display = 'none';
  gngResultsScreen.style.display = 'none';
  gngScreen.style.display = 'flex';

  gngTrialIndex = 0;
  gngErrors = 0;
  gngRTs = [];

  runGoNoGoTrial();
}

function runGoNoGoTrial() {
  if (gngTrialIndex >= TOTAL_GNG_TRIALS) {
    endGoNoGoTask();
    return;
  }
  gngTrialIndex++;

  gngIsGo = Math.random() < 0.9;
  gngWord.textContent = gngIsGo ? 'GO' : 'STOP';

  gngResponded = false;
  gngTrialActive = true;
  gngTrialStart = performance.now();

  gngTimer = setTimeout(() => {
    finishGoNoGoTrial('timeout');
  }, GNG_RESPONSE_WINDOW);
}

function finishGoNoGoTrial(type, rt) {
  if (!gngTrialActive) return;
  gngTrialActive = false;

  clearTimeout(gngTimer);
  gngWord.textContent = '';

  if (gngIsGo) {
    if (type === 'response') {
      gngRTs.push(rt);
    } else {
      gngErrors++; // missed a Go trial
    }
  } else {
    if (type === 'response') {
      gngErrors++; // responded on a Stop trial
    }
  }

  const iti = 500 + (Math.random() * 200 - 100); // 400–600ms
  setTimeout(runGoNoGoTrial, iti);
}

function endGoNoGoTask() {
  gngScreen.style.display = 'none';

  const avg = gngRTs.length
    ? Math.round(gngRTs.reduce((a, b) => a + b, 0) / gngRTs.length)
    : 0;

  gngAvgRT.textContent = `Average Go RT: ${avg} ms (n=${gngRTs.length})`;
  gngErrorsEl.textContent = `Errors: ${gngErrors}`;

  gngResultsScreen.style.display = 'flex';
}

gngRestartBtn.addEventListener('click', () => {
  gngResultsScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
});

stopSignalBtn.addEventListener('click', startStopSignalTask);
</script>

</body>
</html>
