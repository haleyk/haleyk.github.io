<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>N-Back Task</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #222;
    color: #eee;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stimulus {
    font-size: 120px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #container {
  width: 100%;
}
  #feedback {
    font-size: 24px;
    height: 40px;
  }
  button, select {
    font-size: 18px;
    padding: 8px 16px;
    margin: 10px;
  }
  #setup, #task, #results {
    display: none;
  }
  .visible {
    display: block !important;
  }
</style>
</head>
<body>
<div id="container">
<div id="setup" class="visible">
  <h1>N-Back Task</h1>
  <p>Choose your N value:</p>
  <select id="nSelect">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>
  <br>
  <button id="startBtn">Start</button>
</div>

<div id="task">
  <div id="stimulus"></div>
  <div id="feedback"></div>
</div>

<div id="results">
  <h1>Results</h1>
  <div id="summary"></div>
  <button id="restartBtn">Try Again</button>
</div>

<script>
  const TOTAL_TRIALS = 20;
  const STIM_DURATION = 500;   // ms
  const ITI_DURATION = 1000;   // ms
  const RESPONSE_WINDOW = 1000; // ms from stimulus onset

  let N = 2;
  let sequence = [];
  let currentTrial = 0;
  let listening = false;
  let responded = false;
  let results = [];

  const setupDiv = document.getElementById('setup');
  const taskDiv = document.getElementById('task');
  const resultsDiv = document.getElementById('results');
  const stimulusDiv = document.getElementById('stimulus');
  const feedbackDiv = document.getElementById('feedback');
  const summaryDiv = document.getElementById('summary');

  document.getElementById('startBtn').addEventListener('click', () => {
    N = parseInt(document.getElementById('nSelect').value);
    startTask();
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    resultsDiv.classList.remove('visible');
    setupDiv.classList.add('visible');
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (listening && !responded) {
        responded = true;
      }
    }
  });

  function randomDigit() {
    return Math.floor(Math.random() * 10);
  }

  function shuffle(arr) {
    let a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateSequence(n) {
    const matchTarget = Math.round(TOTAL_TRIALS * (1 / 3)); // ~33%
    let possible = [];
    for (let i = n; i < TOTAL_TRIALS; i++) possible.push(i);

    let matchPositions = shuffle(possible).slice(0, matchTarget);
    let matchSet = new Set(matchPositions);

    let seq = [];
    for (let i = 0; i < TOTAL_TRIALS; i++) {
      if (i < n) {
        seq.push(randomDigit());
      } else {
        if (matchSet.has(i)) {
          seq.push(seq[i - n]); // force match
        } else {
          let d;
          do { d = randomDigit(); } while (d === seq[i - n]); // avoid accidental match
          seq.push(d);
        }
      }
    }
    return seq;
  }

  function startTask() {
    sequence = generateSequence(N);
    currentTrial = 0;
    results = [];
    setupDiv.classList.remove('visible');
    taskDiv.classList.add('visible');
    runTrial();
  }

  function runTrial() {
    if (currentTrial >= TOTAL_TRIALS) {
      finishTask();
      return;
    }

    const idx = currentTrial;
    const digit = sequence[idx];
    const isMatch = idx >= N && sequence[idx] === sequence[idx - N];

    responded = false;
    listening = true;
    feedbackDiv.textContent = '';
    stimulusDiv.textContent = digit;

    // Hide stimulus after STIM_DURATION
    setTimeout(() => {
      stimulusDiv.textContent = '';
    }, STIM_DURATION);

    // End response window, evaluate outcome
    setTimeout(() => {
      listening = false;

      let outcome;
      if (isMatch && responded) outcome = 'hit';
      else if (isMatch && !responded) outcome = 'miss';
      else if (!isMatch && responded) outcome = 'falseAlarm';
      else outcome = 'correctRejection';

      results.push({ isMatch, responded, outcome });

      if (outcome === 'hit') {
        feedbackDiv.textContent = 'Correct!';
        feedbackDiv.style.color = 'lightgreen';
      } else if (outcome === 'miss') {
        feedbackDiv.textContent = 'Missed match!';
        feedbackDiv.style.color = 'orange';
      } else if (outcome === 'falseAlarm') {
        feedbackDiv.textContent = 'Incorrect - no match';
        feedbackDiv.style.color = 'red';
      } else {
        feedbackDiv.textContent = ''; // no feedback for correct rejection
      }
    }, RESPONSE_WINDOW);

    // Move to next trial after full trial duration
    setTimeout(() => {
      currentTrial++;
      runTrial();
    }, STIM_DURATION + ITI_DURATION);
  }

  function finishTask() {
    taskDiv.classList.remove('visible');
    resultsDiv.classList.add('visible');

    let hits = 0, misses = 0, falseAlarms = 0, correctRejections = 0;
    results.forEach(r => {
      if (r.outcome === 'hit') hits++;
      else if (r.outcome === 'miss') misses++;
      else if (r.outcome === 'falseAlarm') falseAlarms++;
      else correctRejections++;
    });

    const totalCorrect = hits + correctRejections;
    const accuracy = ((totalCorrect / TOTAL_TRIALS) * 100).toFixed(1);

    summaryDiv.innerHTML = `
      <p>N-Back Level: ${N}</p>
      <p>Total Trials: ${TOTAL_TRIALS}</p>
      <p>Correct Hits: ${hits}</p>
      <p>Missed Matches: ${misses}</p>
      <p>False Alarms: ${falseAlarms}</p>
      <p>Correct Rejections: ${correctRejections}</p>
      <p><strong>Overall Accuracy: ${accuracy}%</strong></p>
    `;
  }
</script>
</div>
</body>
</html>
